[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rvv-miniputt"
version = "2.0.0"
description = "RVV Miniputt tournament scheduler pipeline"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "holidays>=0.38",
    "playwright>=1.40",
    "icalendar>=6.0",
    "recurring-ical-events>=3.0",
    "rich>=14.0",
]

[project.optional-dependencies]
desktop = [
    "keyring>=25.0",
    "pyinstaller>=6.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "PyYAML>=6.0",
]

[project.scripts]
rvv-miniputt = "tournament_scheduler.cli.rvv_cli:main"
rvv-miniputt-desktop-backend = "tournament_scheduler.desktop_server:main"

[tool.pytest.ini_options]
timeout = 30
addopts = [
    "--verbose",
    "-m",
    "not slow and not integration",
    "--cov=tournament_scheduler",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: long-running planner or real-workbook tests excluded from the default quick suite",
    "integration: subprocess or multi-stage integration tests excluded from the default quick suite",
]

[tool.setuptools.packages.find]
include = ["tournament_scheduler*"]

[tool.setuptools.package-data]
"tournament_scheduler.html.templates" = ["*.html", "*.css", "*.js"]
