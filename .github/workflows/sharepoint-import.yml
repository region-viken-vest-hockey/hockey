name: "SharePoint: importer aktivitetsdata (JSON)"
run-name: "Activities sync — issue #${{ inputs.issue_number }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Nummeret på GitHub-issuen som skal importeres"
        required: true
        type: string

permissions:
  contents: write
  issues: write

# Only one debounced activity snapshot may be imported at a time. This also
# cancels an older importer that was dispatched before the router's final
# newest-issue check.
concurrency:
  group: sharepoint-activities-import
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CANONICAL_PATH: "inputs/activities/activities.json"
  SOURCE_PATH: "inputs/activities/activities.xlsx"

jobs:
  import-activities-json:
    name: "Importer aktivitetsdata fra SharePoint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.validate.outputs.changed }}
      version: ${{ steps.parse.outputs.version }}
      drive_item_id: ${{ steps.parse.outputs.drive_item_id }}
      sha256: ${{ steps.validate.outputs.sha256 }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: "Hent kode"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Hent og valider sync-issue"
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" \
            --jq '{title, body, state, author_association}' \
            > "$RUNNER_TEMP/issue.json"

          jq -e '
            .author_association as $association
            | .title == "sharepoint-sync: activities"
              and .state == "open"
              and (["OWNER", "MEMBER", "COLLABORATOR"] | index($association) != null)
          ' "$RUNNER_TEMP/issue.json" >/dev/null || {
            echo "Issue is not an open trusted activity sync request" >&2
            exit 1
          }

          jq -r '.body' "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/issue-body.txt"
          echo "body_file=$RUNNER_TEMP/issue-body.txt" >> "$GITHUB_OUTPUT"

      - name: "Sett opp Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: "Installer runtime-avhengigheter"
        run: pip install -e .

      - name: "Parse issue-body"
        id: parse
        env:
          ISSUE_BODY_FILE: ${{ steps.issue.outputs.body_file }}
          EXPECTED_DRIVE_ID: ${{ vars.SHAREPOINT_ACTIVITIES_DRIVE_ID }}
          EXPECTED_DRIVE_ITEM_ID: ${{ vars.SHAREPOINT_ACTIVITIES_DRIVE_ITEM_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          issue_body = Path(os.environ["ISSUE_BODY_FILE"]).read_text(encoding="utf-8")
          required = {"source", "content_json"}
          allowed = required | {"target_path", "drive_id", "drive_item_id", "version"}
          parsed = {}
          seen = set()
          errors = []

          for raw_line in issue_body.splitlines():
              line = raw_line.strip()
              if not line or line.startswith(("#", ">", "```")):
                  continue
              match = re.match(r"^([a-z_][a-z0-9_]*)=(.*)$", line)
              if not match:
                  continue
              key, value = match.group(1), match.group(2).strip()
              if key in seen:
                  errors.append(f"Duplikat nøkkel: {key}")
                  continue
              if key not in allowed:
                  errors.append(f"Ukjent nøkkel: {key}")
                  continue
              seen.add(key)
              if not value:
                  errors.append(f"Tom verdi for: {key}")
                  continue
              parsed[key] = value

          missing = required - set(parsed)
          if missing:
              errors.append(f"Mangler påkrevde felt: {', '.join(sorted(missing))}")
          if parsed.get("source") != "sharepoint":
              errors.append("source må være 'sharepoint'")

          target_path = parsed.get("target_path")
          if target_path and target_path not in {os.environ["SOURCE_PATH"], os.environ["CANONICAL_PATH"]}:
              errors.append("target_path matcher verken SharePoint-kildefilen eller kanonisk repository-sti")

          expected_drive_id = os.environ.get("EXPECTED_DRIVE_ID", "")
          expected_drive_item_id = os.environ.get("EXPECTED_DRIVE_ITEM_ID", "")
          if expected_drive_id and parsed.get("drive_id", "") != expected_drive_id:
              errors.append("drive_id matcher ikke forventet repository-variabel")
          if expected_drive_item_id and parsed.get("drive_item_id", "") != expected_drive_item_id:
              errors.append("drive_item_id matcher ikke forventet repository-variabel")

          try:
              content_json = json.loads(parsed.get("content_json", ""))
          except json.JSONDecodeError as exc:
              errors.append(f"content_json er ikke gyldig JSON: {exc}")
              content_json = None

          if errors:
              for error in errors:
                  print(f"✗ {error}", file=sys.stderr)
              raise SystemExit(1)

          payload_path = Path(os.environ["RUNNER_TEMP"]) / "activity-content.json"
          payload_path.write_text(json.dumps(content_json, ensure_ascii=False), encoding="utf-8")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"content_json_file={payload_path}", file=output)
              for key in ("drive_id", "drive_item_id", "version"):
                  print(f"{key}={parsed.get(key, '')}", file=output)
          PY

      - name: "Valider og skriv kanonisk aktivitetsfil"
        id: validate
        env:
          CONTENT_JSON_FILE: ${{ steps.parse.outputs.content_json_file }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from tournament_scheduler.pipeline.activity_export import (
              ActivityJSONValidationError,
              validate_content_json,
          )

          payload = json.loads(Path(os.environ["CONTENT_JSON_FILE"]).read_text(encoding="utf-8"))
          try:
              validate_content_json(payload)
          except ActivityJSONValidationError as exc:
              raise SystemExit(f"JSON-kontrakt feilet: {exc}") from exc

          normalized_bytes = (
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          ).encode("utf-8")
          canonical_path = Path(os.environ["CANONICAL_PATH"])
          changed = not canonical_path.exists() or canonical_path.read_bytes() != normalized_bytes
          if changed:
              canonical_path.parent.mkdir(parents=True, exist_ok=True)
              canonical_path.write_bytes(normalized_bytes)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"changed={'true' if changed else 'false'}", file=output)
              print(f"sha256={hashlib.sha256(normalized_bytes).hexdigest()}", file=output)
          PY

      - name: "Commit og push endret aktivitetsdata"
        if: steps.validate.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CANONICAL_PATH"
          git commit \
            -m "[bot] Importer aktivitetsdata fra SharePoint" \
            -m "source=sharepoint drive_id=${{ steps.parse.outputs.drive_id || 'ukjent' }} drive_item_id=${{ steps.parse.outputs.drive_item_id || 'ukjent' }} version=${{ steps.parse.outputs.version || 'ukjent' }}"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-activity-calendar:
    name: "Generer og publiser aktivitetskalender"
    needs: import-activities-json
    if: needs.import-activities-json.result == 'success'
    uses: ./.github/workflows/activity-publish.yml
    with:
      activity_input: inputs/activities/activities.json
      activity_input_format: json
      checkout_ref: ${{ needs.import-activities-json.outputs.commit_sha || github.sha }}
    secrets: inherit

  finalize-sync-issue:
    name: "Rapporter resultat og avslutt sync-issue"
    needs: [import-activities-json, publish-activity-calendar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      IMPORT_RESULT: ${{ needs.import-activities-json.result }}
      PUBLISH_RESULT: ${{ needs.publish-activity-calendar.result }}
      FILE_CHANGED: ${{ needs.import-activities-json.outputs.changed }}
      FILE_SHA256: ${{ needs.import-activities-json.outputs.sha256 }}
      DRIVE_ITEM_ID: ${{ needs.import-activities-json.outputs.drive_item_id }}
      VERSION: ${{ needs.import-activities-json.outputs.version }}
    steps:
      - name: "Kommenter og lukk ved suksess"
        if: env.IMPORT_RESULT == 'success' && env.PUBLISH_RESULT == 'success'
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${OWNER}.github.io/${REPO}/latest/activities/"
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "✅ Aktivitetsdata er validert og publisert. Endret: ${FILE_CHANGED:-false}. Version: ${VERSION:-ukjent}. DriveItemId: ${DRIVE_ITEM_ID:-ukjent}. SHA-256: ${FILE_SHA256:-ukjent}. Publisert HTML: $PAGES_URL."
          gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --reason completed

      - name: "Lukk tidligere sync-issues etter vellykket nyeste kjøring"
        if: env.IMPORT_RESULT == 'success' && env.PUBLISH_RESULT == 'success'
        run: |
          # Issue numbers are monotonically increasing, so this cannot close
          # an issue created after the one that was actually imported.
          gh api --paginate --slurp \
            "repos/$GH_REPO/issues?state=open&per_page=100" \
            | jq -r --argjson current "$ISSUE_NUMBER" '
                add[]
                | select(.pull_request == null)
                | select(.title == "sharepoint-sync: activities")
                | select(.author_association as $association
                    | ["OWNER", "MEMBER", "COLLABORATOR"] | index($association) != null)
                | select(.number < $current)
                | .number
              ' \
            | while read -r previous_issue; do
                [ -n "$previous_issue" ] || continue
                gh issue close "$previous_issue" --repo "$GH_REPO" --reason "not planned" || true
              done

      - name: "Kommenter ved feil"
        if: env.IMPORT_RESULT != 'success' || env.PUBLISH_RESULT != 'success'
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "❌ Synkronisering feilet. Import: $IMPORT_RESULT. Publisering: $PUBLISH_RESULT. Run: $ACTIONS_URL"
