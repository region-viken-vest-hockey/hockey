name: CI

on:
  pull_request:
    paths:
      - "tournament_scheduler/**"
      - "tests/**"
      - "scripts/**"
      - ".agents/**"
      - ".claude/**"
      - ".chatgpt/**"
      - ".codex/**"
      - ".pi/**"
      - "AGENTS.md"
      - "Makefile"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "requirements.lock"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.pi.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "tournament_scheduler/**"
      - "tests/**"
      - "scripts/**"
      - ".agents/**"
      - ".claude/**"
      - ".chatgpt/**"
      - ".codex/**"
      - ".pi/**"
      - "AGENTS.md"
      - "Makefile"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "requirements.lock"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.pi.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  dependency-lock:
    name: Python dependency lock freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip<26"
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Verify dependency lock freshness
        run: scripts/check dependency-lock

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip<26"
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run ruff
        run: scripts/check lint

  pi-typecheck:
    name: Pi TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck Pi extension
        run: npm run check:pi

  quick:
    name: Python quick test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip<26"
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Compile Python sources
        run: python -m compileall -q tournament_scheduler tests

      - name: Run fast test suite without coverage
        run: scripts/check quick

      - name: Upload coverage/debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quick-test-artifacts
          path: |
            htmlcov/
            .pytest_cache/
          if-no-files-found: ignore

  operator:
    name: Operator manifest & escalation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip<26"
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run operator control-path tests
        run: scripts/check operator

  reproducibility:
    name: Deterministic planner reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip<26"
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run reproducibility tests
        run: scripts/check reproducibility

      - name: Upload reproducibility artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-artifacts
          path: repro-tmp/
          if-no-files-found: ignore

  cli-smoke:
    name: CLI integration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip<26"
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run CLI smoke test
        run: scripts/check cli-smoke

      - name: Upload CLI smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-smoke-artifacts
          path: cli-smoke-tmp/
          if-no-files-found: ignore
