name: CI

on:
  pull_request:
    paths:
      - "scripts/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"

permissions:
  contents: write

concurrency:
  group: ci-lock-repair-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  repair-lock:
    name: One-time migration lock repair
    if: github.head_ref == 'chatgpt/remove-desktop-update-rvv-skill'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Regenerate lock from a fresh output path
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip<26" "pip-tools==7.6.0"
          PIP_COMPILE_BIN=pip-compile scripts/refresh-python-lock.sh
          python -m pip install --require-hashes -r requirements.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          if ! git diff --cached --quiet; then
            git commit -m "regenerate Python dependency lock from clean output"
            git push origin HEAD:${{ github.head_ref }}
          fi
