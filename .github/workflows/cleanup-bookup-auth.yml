name: One-shot BookUp auth cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-bookup-auth.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply cleanup
        run: |
          python scripts/one-shot-cleanup-bookup-auth.py
          cat >> .pi/lib/scraper-agent.ts <<'EOF'

          export function substituteEnvVars(text: string): string {
            return text.replace(/\$\{(\w+)\}/g, (_match, name: string) => process.env[name] ?? "");
          }
          EOF
          npm uninstall @dotenvx/dotenvx --package-lock-only --ignore-scripts

      - name: Verify focused cleanup
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip<26"
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m compileall -q tournament_scheduler tests
          npm ci --ignore-scripts
          npm run check:pi
          python -m pytest -q --no-cov tests/test_stage2_scraping.py tests/test_browser_worker.py tests/test_rvv_cli_portability.py tests/test_makefile_operator_interface.py tests/test_scraper_strategies.py
          python - <<'PY'
          from pathlib import Path
          forbidden = (
              "BOOKUP_EMAIL",
              "BOOKUP_PASSWORD",
              "RVV_BOOKUP_MANUAL_LOGIN",
              "RVV_BOOKUP_HOST_BRIDGE",
              ".env.bookup",
              "run-dotenvx",
              "calendars-refresh-dotenvx",
          )
          roots = [Path("tournament_scheduler"), Path(".pi"), Path("tests"), Path("Makefile"), Path("README.md")]
          hits = []
          for root in roots:
              paths = [root] if root.is_file() else [p for p in root.rglob("*") if p.is_file()]
              for path in paths:
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for token in forbidden:
                      if token in text:
                          hits.append(f"{path}: {token}")
          if hits:
              raise SystemExit("Stale BookUp auth references remain:\n" + "\n".join(hits))
          PY

      - name: Commit cleanup
        run: |
          rm -f .github/workflows/cleanup-bookup-auth.yml scripts/one-shot-cleanup-bookup-auth.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "cleanup(bookup): retire authentication and session plumbing"
          git push origin HEAD:main
