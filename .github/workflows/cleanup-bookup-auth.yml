name: One-shot BookUp auth cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-bookup-auth.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove retired BookUp authentication paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, repl: str, label: str) -> str:
              new, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one regex match, found {count}")
              return new

          # Stage 2: BookUp is public. Keep the generic credential abstraction for
          # any future non-BookUp provider, but remove BookUp manual-login plumbing.
          p = "tournament_scheduler/pipeline/stage2_scraping.py"
          t = read(p)
          t = t.replace("import os\n", "", 1)
          t = replace_once(
              t,
              "from .scraper_credentialed import (\n    _manual_bookup_login_enabled,\n    _try_credentialed_scrape,\n)\n",
              "from .scraper_credentialed import _try_credentialed_scrape\n",
              "stage2 credential import",
          )
          t = sub_once(
              t,
              r"\n    if _manual_bookup_login_enabled\(\):\n        # Manual MFA.*?\n        max_workers = 1\n",
              "\n",
              "stage2 manual worker limit",
          )
          t = replace_once(
              t,
              "        # BookUp sources can expose a tiny public placeholder calendar while the\n"
              "        # useful arena schedule is behind login. If credentials are declared,\n"
              "        # the public scrape is not trustworthy enough to use as fallback: a\n"
              "        # failed login must surface as blocked/manual-recovery-needed instead\n"
              "        # of silently accepting a handful of generic \"Booket\" entries.\n",
              "        # A future non-BookUp source may explicitly declare credentials. In that\n"
              "        # case the credentialed adapter is attempted before public scraping.\n"
              "        # Current BookUp sources are public and never enter this branch.\n",
              "stage2 stale BookUp credential comment",
          )
          t = sub_once(
              t,
              r"\n    parser\.add_argument\(\n        \"--manual-bookup-login\".*?\n    \)\n    parser\.add_argument\(\n        \"--manual-bookup-login-timeout\".*?\n    \)\n",
              "\n",
              "stage2 module manual flags",
          )
          t = sub_once(
              t,
              r"\n    if cli_args\.manual_bookup_login:.*?RVV_BOOKUP_MANUAL_LOGIN_TIMEOUT.*?\n",
              "\n",
              "stage2 module manual env wiring",
          )
          write(p, t)

          # Credentialed adapter remains generic only; BookUp has no authenticated path.
          p = "tournament_scheduler/pipeline/scraper_credentialed.py"
          write(p, '''"""Optional credentialed browser adapter for future non-public sources.

Current RVV BookUp sources are public and are handled by ``scraper_bookup``.
This module deliberately contains no BookUp login, MFA, headed-browser, or
session-handoff behavior. It exists only for a future source strategy that
explicitly declares environment-variable credentials.
"""

from __future__ import annotations

import os
from datetime import datetime
from string import Template
from typing import Any
from urllib.parse import parse_qs, urlencode, urlparse, urlunparse

from ..data_sources.calendar_scraper import OutlookCalendarScraper
from ..models import CalendarEvent
from ..utils.calendar_cache import CalendarCache
from .scraper_outlook import _parse_date_param_calendar, _parse_outlook_calendar
from .scraper_strategies import get_strategy, requires_credentials


def _try_credentialed_scrape(
    name: str,
    url: str,
    start_date: datetime,
    end_date: datetime,
    cache: CalendarCache | None = None,
) -> tuple[list[CalendarEvent], str]:
    """Attempt a source strategy that explicitly declares credentials.

    BookUp never uses this function. The strategy must declare both
    ``credential_env_vars`` and non-interactive ``initial_navigation`` steps.
    """
    strategy = get_strategy(name)
    if not strategy or not requires_credentials(strategy):
        return [], ""

    missing = [var for var in strategy.credential_env_vars if not os.environ.get(var)]
    if missing:
        return [], (
            f"Kilden '{name}' krever innlogging men miljovariablene "
            f"{', '.join(missing)} er ikke satt."
        )
    if not strategy.initial_navigation:
        return [], f"Kilden '{name}' har credentials men ingen initial_navigation."
    if any(step.get("cmd") == "manual_login" for step in strategy.initial_navigation):
        return [], (
            f"Kilden '{name}' bruker en utfaset manuell innloggingsstrategi. "
            "Integrer kilden med en ikke-interaktiv eller offentlig datakilde i stedet."
        )

    creds = {var: os.environ[var] for var in strategy.credential_env_vars}
    try:
        return _run_credentialed_browser(name, url, start_date, end_date, strategy, creds, cache)
    except Exception as exc:
        return [], f"Credentialed scrape feilet for '{name}': {exc}"


def _run_credentialed_browser(
    name: str,
    url: str,
    start_date: datetime,
    end_date: datetime,
    strategy: Any,
    creds: dict[str, str],
    cache: CalendarCache | None = None,
) -> tuple[list[CalendarEvent], str]:
    """Run a non-interactive, headless credentialed browser strategy."""
    from playwright.sync_api import sync_playwright

    events: list[CalendarEvent] = []
    norwegian_months = OutlookCalendarScraper(cache).norwegian_months
    start_month = start_date.replace(day=1, hour=0, minute=0, second=0, microsecond=0)
    end_month = end_date.replace(day=1, hour=0, minute=0, second=0, microsecond=0)
    months_to_scrape = (
        (end_month.year - start_month.year) * 12
        + (end_month.month - start_month.month)
        + 1
    )

    try:
        with sync_playwright() as p:
            browser = p.chromium.launch(headless=True)
            page = browser.new_page()
            page.goto(url, timeout=30_000)
            page.wait_for_timeout(3_000)

            for step in strategy.initial_navigation:
                cmd = step.get("cmd", "")
                selector = Template(step.get("selector", "")).safe_substitute(creds)
                text = Template(step.get("text", "")).safe_substitute(creds)
                wait_ms = int(step.get("wait_ms", 1_500))

                if cmd == "click" and selector:
                    el = page.locator(selector)
                    if el.count() > 0:
                        el.first.click()
                elif cmd == "type" and selector:
                    el = page.locator(selector)
                    if el.count() > 0:
                        el.first.fill(text)
                elif cmd == "goto" and step.get("url"):
                    page.goto(Template(str(step["url"])).safe_substitute(creds), timeout=30_000)
                elif cmd == "wait":
                    pass
                else:
                    return [], f"Ustøttet initial_navigation-kommando '{cmd}' for '{name}'."
                page.wait_for_timeout(wait_ms)

            _credentialed_scrape_months(
                page,
                events,
                months_to_scrape,
                norwegian_months,
                start_month=start_month,
            )
            browser.close()
    except Exception as exc:
        return [], f"Credentialed Playwright-feil for '{name}': {exc}"

    seen: set[tuple[str, str]] = set()
    unique: list[CalendarEvent] = []
    for event in events:
        key = (event.date, event.name)
        if key not in seen:
            seen.add(key)
            unique.append(event)
    return unique, ""


def _credentialed_scrape_months(
    page: Any,
    events: list[CalendarEvent],
    months_to_scrape: int,
    norwegian_months: dict[str, int],
    *,
    start_month: datetime,
) -> None:
    """Extract Outlook/date-parameter calendar data from an authenticated page."""
    iframe_element = page.query_selector("iframe")
    has_iframe = iframe_element is not None and iframe_element.content_frame() is not None

    if has_iframe:
        iframe = iframe_element.content_frame()
        iframe.wait_for_timeout(3_000)
        for month_idx in range(months_to_scrape):
            iframe.wait_for_timeout(1_000)
            events.extend(_parse_outlook_calendar(iframe.content(), norwegian_months))
            if month_idx < months_to_scrape - 1:
                try:
                    next_btn = iframe.query_selector('button[aria-label*="next month"]')
                    if next_btn:
                        next_btn.click()
                        iframe.wait_for_timeout(1_500)
                except Exception:
                    pass
        return

    parsed = urlparse(page.url)
    query = parse_qs(parsed.query)
    current_month = start_month
    for _ in range(months_to_scrape):
        q = dict(query)
        q["date"] = [current_month.strftime("%Y-%m-%d")]
        month_url = urlunparse(parsed._replace(query=urlencode(q, doseq=True)))
        try:
            page.goto(month_url, timeout=30_000)
            page.wait_for_timeout(3_000)
            events.extend(
                _parse_date_param_calendar(page.content(), current_month, norwegian_months)
            )
        except Exception:
            pass
        if current_month.month == 12:
            current_month = current_month.replace(year=current_month.year + 1, month=1)
        else:
            current_month = current_month.replace(month=current_month.month + 1)
''')

          # CLI parser/orchestrators: remove obsolete BookUp MFA flags and env wiring.
          p = "tournament_scheduler/cli/args.py"
          t = read(p)
          for owner in ("run", "scrape"):
              t, n = re.subn(
                  rf'\n    {owner}\.add_argument\(\n        "--manual-bookup-login".*?\n    \)\n    {owner}\.add_argument\(\n        "--manual-bookup-login-timeout".*?\n    \)\n',
                  "\n",
                  t,
                  count=1,
                  flags=re.S,
              )
              if n != 1:
                  raise SystemExit(f"args.py {owner} manual BookUp flags: found {n}")
          write(p, t)

          p = "tournament_scheduler/cli/pipeline_orchestrator/stage2.py"
          t = read(p)
          t = replace_once(t, "    import os\n\n", "", "stage2 orchestrator os import")
          t = sub_once(
              t,
              r'\n    if getattr\(args, "manual_bookup_login", False\):.*?RVV_BOOKUP_MANUAL_LOGIN_TIMEOUT.*?\n',
              "\n",
              "stage2 orchestrator manual env",
          )
          t = sub_once(
              t,
              r'\n        if getattr\(args, "manual_bookup_login", False\):\n            _console\.print\(.*?\n            \)\n',
              "\n",
              "stage2 orchestrator manual status",
          )
          write(p, t)

          p = "tournament_scheduler/cli/pipeline_orchestrator/calendars_scrape.py"
          t = read(p)
          t = sub_once(
              t,
              r'\n    if getattr\(args, "manual_bookup_login", False\):.*?RVV_BOOKUP_MANUAL_LOGIN_TIMEOUT.*?\n',
              "\n",
              "single-source manual env",
          )
          write(p, t)

          # Pi browser transport no longer models login/MFA or BookUp secret redaction.
          p = ".pi/lib/scraper-agent.ts"
          t = read(p)
          t = t.replace('  cmd: "click" | "goto" | "type" | "wait" | "extract" | "manual_login";\n',
                        '  cmd: "click" | "goto" | "type" | "wait" | "extract";\n')
          t = t.replace("    redactCredentials((snapshot.html ?? \"\").slice(0, 3000)),\n",
                        "    (snapshot.html ?? \"\").slice(0, 3000),\n")
          t = t.replace('    lines.push("", "Iframe HTML (første 3000 tegn):", redactCredentials(snapshot.iframe_html.slice(0, 3000)));\n',
                        '    lines.push("", "Iframe HTML (første 3000 tegn):", snapshot.iframe_html.slice(0, 3000));\n')
          t = t.replace('      lines.push(`  <${el.tag}> "${redactCredentials(el.text)}" → ${el.selector}`);\n',
                        '      lines.push(`  <${el.tag}> "${el.text}" → ${el.selector}`);\n')
          t = sub_once(
              t,
              r'\nfunction isManualBookupLoginEnabled\(\): boolean \{.*?\n\}\n',
              "\n",
              "Pi manual login flag helper",
          )
          t = sub_once(
              t,
              r'        if \(step\.cmd === "manual_login"\) \{.*?\n        \} else if \(step\.cmd === "click"\) \{',
              '        if (step.cmd === "click") {',
              "Pi manual login navigation branch",
          )
          t = sub_once(
              t,
              r'\nexport function substituteEnvVars\(text: string\): string \{.*?\n\}\n\nexport function redactCredentials\(text: string\): string \{.*?\n\}\n?$ ',
              "\n",
              "Pi obsolete credential helpers",
          ) if False else t
          # Footer removal with a less whitespace-sensitive expression.
          t, n = re.subn(
              r'\nexport function substituteEnvVars\(text: string\): string \{.*?\n\}\n\nexport function redactCredentials\(text: string\): string \{.*?\n\}\s*$',
              "\n",
              t,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f"Pi obsolete credential helpers: found {n}")
          write(p, t)
          Path(".pi/lib/scraper-agent.test.ts").unlink(missing_ok=True)

          # Browser worker remains privacy-safe but no longer knows BookUp secrets or headed MFA mode.
          p = "tournament_scheduler/pipeline/browser_worker.py"
          t = read(p)
          t = replace_once(
              t,
              "line on stdin. Each command is executed against a persistent Chromium page (headless by default;\nheaded when `RVV_BOOKUP_MANUAL_LOGIN=1`), and the result is written as one JSON line on stdout.\n",
              "line on stdin. Each command is executed against a persistent headless Chromium page,\nand the result is written as one JSON line on stdout.\n",
              "browser worker headed doc",
          )
          t = t.replace("import os\n", "", 1)
          t = sub_once(
              t,
              r'# ---------------------------------------------------------------------------\n# Credential-leak mitigation.*?_CREDENTIAL_INPUT_RE = re\.compile\(',
              '# ---------------------------------------------------------------------------\n# Snapshot privacy\n# ---------------------------------------------------------------------------\n# Browser snapshots can be sent to an LLM during recovery. Blank values from\n# common login/account fields defensively even though current RVV calendar\n# sources, including BookUp, are public and require no authentication.\n\n_CREDENTIAL_INPUT_RE = re.compile(',
              "browser worker credential comment",
          )
          t = sub_once(
              t,
              r'\n\ndef _redact_credentials\(text: str\) -> str:.*?\n    return text\n',
              "\n",
              "browser worker BookUp redactor",
          )
          t = replace_once(
              t,
              '        headed = os.environ.get("RVV_BOOKUP_MANUAL_LOGIN", "").strip().lower() in {\n            "1", "true", "yes", "y", "on"\n        }\n        self._browser = p.chromium.launch(headless=not headed)\n',
              '        self._browser = p.chromium.launch(headless=True)\n',
              "browser worker headed launch",
          )
          t = t.replace('"text": _redact_credentials(label_text)[:80],', '"text": label_text[:80],')
          write(p, t)

          p = "tests/test_browser_worker.py"
          t = read(p)
          t = t.replace('"""Unit tests for credential-leak sanitization in browser_worker.py."""',
                        '"""Unit tests for browser snapshot sanitization and navigation behavior."""')
          t = t.replace("    _redact_credentials,\n", "")
          t = re.sub(r'\n\nclass TestRedactCredentials:.*?\n\nclass TestCmdGotoRetry:', '\n\nclass TestCmdGotoRetry:', t, count=1, flags=re.S)
          write(p, t)

          # CLI portability no longer promises obsolete manual-login flags.
          p = "tests/test_rvv_cli_portability.py"
          t = read(p)
          t = t.replace('            "--manual-bookup-login",\n            "--manual-bookup-login-timeout",\n            "600",\n', '')
          t = t.replace('    assert args.manual_bookup_login is True\n    assert args.manual_bookup_login_timeout == 600\n', '')
          write(p, t)

          # Stage 2 tests: remove MFA-only tests and make generic credential test provider-neutral.
          p = "tests/test_stage2_scraping.py"
          t = read(p)
          t = sub_once(
              t,
              r'\nfrom tournament_scheduler\.pipeline\.scraper_credentialed import \(\n    _manual_bookup_login_enabled,\n    _wait_for_manual_bookup_login,\n\)\n',
              "\n",
              "stage2 test manual imports",
          )
          t = sub_once(t, r'\n\nclass TestManualBookupLogin:.*?\n\nclass TestRunStage2:', '\n\nclass TestRunStage2:', 'stage2 manual login tests')
          t = t.replace('engine=CalendarEngine.BOOKUP_SPA,\n            url="https://bookup.example.com",\n            credential_env_vars=["BOOKUP_EMAIL", "BOOKUP_PASSWORD"],\n            initial_navigation=[{"action": "fill", "selector": "#email", "text": "BOOKUP_EMAIL"}],',
                        'engine=CalendarEngine.OUTLOOK_IFRAME,\n            url="https://private-calendar.example.com",\n            credential_env_vars=["CALENDAR_USER", "CALENDAR_PASSWORD"],\n            initial_navigation=[{"cmd": "type", "selector": "#email", "text": "${CALENDAR_USER}"}],')
          t = t.replace('monkeypatch.setenv("BOOKUP_EMAIL", "test@example.com")\n        monkeypatch.setenv("BOOKUP_PASSWORD", "secret")',
                        'monkeypatch.setenv("CALENDAR_USER", "test@example.com")\n        monkeypatch.setenv("CALENDAR_PASSWORD", "secret")')
          t = t.replace('{"name": "Bookup", "type": SOURCE_ICAL, "url": "https://bookup.example.com/ical"},',
                        '{"name": "Private calendar", "type": SOURCE_ICAL, "url": "https://private-calendar.example.com/ical"},')
          t = t.replace('"tournament_scheduler.pipeline.scraper_credentialed._run_credentialed_bookup_or_outlook",',
                        '"tournament_scheduler.pipeline.scraper_credentialed._run_credentialed_browser",')
          t = t.replace('_run_credentialed_bookup_or_outlook is called.', '_run_credentialed_browser is called.')
          write(p, t)

          # Makefile: remove credential-wrapper targets now that BookUp is public.
          p = "Makefile"
          t = read(p)
          t = t.replace('DOTENVX ?= $(ROOT_DIR)/node_modules/.bin/dotenvx\nDOTENVX_ENV_FILE ?= $(ROOT_DIR)/.env.bookup\n', '')
          t = t.replace('export ID ANSWER SCOPE SCOPE_KEY RUN_ID TAG CONFIRM_PUBLIC CSV ARGS DOTENVX_ENV_FILE BACKEND RESULT_FILE',
                        'export ID ANSWER SCOPE SCOPE_KEY RUN_ID TAG CONFIRM_PUBLIC CSV ARGS BACKEND RESULT_FILE')
          t = t.replace('operator-run operator-run-force run run-dotenvx status logs calendars calendars-refresh calendars-refresh-dotenvx sources-status \\\n',
                        'operator-run operator-run-force run status logs calendars calendars-refresh sources-status \\\n')
          t = t.replace('\t@echo "  make run-dotenvx [ARGS=\'...\']      dotenvx run -f .env.bookup -- scripts/rvv-miniputt run"\n', '')
          t = t.replace('\t@echo "  make calendars-refresh-dotenvx     dotenvx calendars --refresh using .env.bookup"\n', '')
          t = re.sub(r'\nrun-dotenvx:\n.*?\n\nstatus:', '\n\nstatus:', t, count=1, flags=re.S)
          t = re.sub(r'\ncalendars-refresh-dotenvx:\n.*?\n\nsources-status:', '\n\nsources-status:', t, count=1, flags=re.S)
          write(p, t)

          p = "tests/test_makefile_operator_interface.py"
          t = read(p)
          t = t.replace('    "run-dotenvx",\n', '')
          t = t.replace('    "calendars-refresh-dotenvx",\n', '')
          t = re.sub(r'\n\ndef _fake_dotenvx\(.*?\n    return script, log_path\n', '', t, count=1, flags=re.S)
          t = re.sub(r'\n    def test_dotenvx_targets_wrap_rvv_cli_with_env_file\(.*?\n    def test_human_answer_preserves_spaces_and_shell_characters',
                     '\n    def test_human_answer_preserves_spaces_and_shell_characters', t, count=1, flags=re.S)
          write(p, t)

          # Current docs: BookUp is a public JS-rendered source, not a credential/session dependency.
          p = "README.md"
          t = read(p)
          t = t.replace('| BookUp credentials/session | Local runtime credential/session input for gated sources. Never planner data and never public output. |\n', '')
          write(p, t)

          p = "tournament_scheduler/club_registry.py"
          t = read(p)
          t = replace_once(
              t,
              'A BookUp source for Tønsberg has a known URL but requires\nBOOKUP_EMAIL/BOOKUP_PASSWORD and may still need manual/MFA recovery before the\nfull private booking calendar can be trusted.\n',
              "Tønsberg uses BookUp's public JavaScript-rendered availability calendar. Stage 2\nreads it deterministically with Playwright; no account, credential, MFA, or\nsession handoff is required.\n",
              "club registry BookUp auth docs",
          )
          t = t.replace('older, non-pipeline `scheduling_command`/`season_command`/`reschedule_command`\nCLI tools that still build a live `CalendarDataSource` from the registry --\nthe Stage 1-4 pipeline never scrapes it.',
                        'legacy registry consumers that still inspect `CalendarDataSource`; the\nStage 1-4 pipeline uses the fixed-allocation source instead.')
          write(p, t)

          p = "docs/ownership-and-handover.md"
          t = read(p)
          t = t.replace('; never `BOOKUP_EMAIL`/`BOOKUP_PASSWORD` in prompts/logs', '; never source credentials in prompts/logs')
          write(p, t)

          p = "docs/adr/0001-stage-3-v2-generic-optimization-and-portable-bookup-session-handoff.md"
          t = read(p)
          marker = '## BookUp/browser recovery boundary\n\n'
          note = ('> **Current status (2026-09-15):** BookUp no longer requires authentication in RVV. '
                  'Tønsberg is scraped from the public availability view, so the BookUp credential/MFA/session-handoff '
                  'mechanism described below has been retired. The general rule that browser-recovered data must return '
                  'through repository validation still applies.\n\n')
          if note not in t:
              t = replace_once(t, marker, marker + note, 'ADR BookUp retirement note')
          write(p, t)

          # Remove deleted auth components from the file-length debt baseline.
          p = "scripts/file-length-baseline.txt"
          t = read(p)
          t = re.sub(r'^tournament_scheduler/pipeline/bookup_host_bridge\.py\t\d+\n', '', t, flags=re.M)
          t = re.sub(r'^tournament_scheduler/pipeline/scraper_credentialed\.py\t\d+\n', '', t, flags=re.M)
          write(p, t)
          PY

          npm uninstall @dotenvx/dotenvx --package-lock-only --ignore-scripts

          # The one-shot workflow removes itself in the cleanup commit.
          rm -f .github/workflows/cleanup-bookup-auth.yml

      - name: Verify focused cleanup
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip<26"
          python -m pip install -r requirements.txt
          python -m compileall -q tournament_scheduler tests
          npm ci --ignore-scripts
          npm run check:pi
          python -m pytest -q --no-cov \
            tests/test_stage2_scraping.py \
            tests/test_browser_worker.py \
            tests/test_rvv_cli_portability.py \
            tests/test_makefile_operator_interface.py \
            tests/test_scraper_strategies.py
          python - <<'PY'
          from pathlib import Path
          forbidden = (
              "BOOKUP_EMAIL",
              "BOOKUP_PASSWORD",
              "RVV_BOOKUP_MANUAL_LOGIN",
              "RVV_BOOKUP_HOST_BRIDGE",
              ".env.bookup",
              "run-dotenvx",
              "calendars-refresh-dotenvx",
          )
          roots = [Path("tournament_scheduler"), Path(".pi"), Path("tests"), Path("Makefile"), Path("README.md")]
          hits = []
          for root in roots:
              paths = [root] if root.is_file() else [p for p in root.rglob("*") if p.is_file()]
              for path in paths:
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for token in forbidden:
                      if token in text:
                          hits.append(f"{path}: {token}")
          if hits:
              raise SystemExit("Stale BookUp auth references remain:\n" + "\n".join(hits))
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "cleanup(bookup): retire authentication and session plumbing"
          git push origin HEAD:main
