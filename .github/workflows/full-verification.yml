name: Full verification

# Scheduled/manual comprehensive lane. This is intentionally NOT a required
# PR check: the full hermetic suite includes the real canonical workbook/planner
# tests (marked ``slow``) and can take several minutes, so it runs nightly and
# on demand instead of gating every small change. A failure is still visible as
# a normal workflow run and uploads its artifacts for inspection.
on:
  workflow_dispatch:
  schedule:
    # Nightly (UTC). Adjust the hour to taste; a few times per week is fine too.
    - cron: "41 2 * * *"

concurrency:
  group: full-verification-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  full:
    name: Full hermetic verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip<26"
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Compile Python sources
        run: python -m compileall -q tournament_scheduler tests

      # Lint + quick + slow + hermetic integration + rules-report, in one
      # canonical invocation. Includes the real canonical input.xlsx planner
      # path that the quick PR lane deliberately skips.
      - name: Run full hermetic verification
        run: scripts/check full

      - name: Upload full-lane artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-verification-artifacts
          path: |
            htmlcov/
            .pytest_cache/
            repro-tmp/
          if-no-files-found: ignore

  live:
    name: Live external-source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # An upstream outage or markup change must never fail the lane as a whole;
    # the run result is still visible and actionable on its own.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip<26"
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run live external-source tests
        run: scripts/check live

      - name: Upload live-lane artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-verification-artifacts
          path: .pytest_cache/
          if-no-files-found: ignore
