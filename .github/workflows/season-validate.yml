name: "Sesong: valider inndata"

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: "Sti til sesongarbeidsboken som skal valideres"
        required: true
        default: "input.xlsx"
      log_level:
        description: "Loggnivå for operatørkjøringen"
        required: true
        type: choice
        options:
          - info
          - verbose
        default: info

permissions:
  contents: read

concurrency:
  group: season-validate-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  WORK_DIR: .pipeline/github-validate
  EXPORT_DIR: export/github-validate
  REGISTRATIONS_PATH: inputs/registrations/registered-teams.csv

jobs:
  validate:
    name: "Valider arbeidsbok og kilder"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: "Hent kode"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Sett opp Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: "Installer avhengigheter"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[test]'

      - name: "Valider SharePoint-snapshot for påmeldte lag"
        run: python scripts/check-registration-snapshot.py

      - name: "Synkroniser autoritative påmeldinger inn i sesongarbeidsboken"
        env:
          INPUT_PATH: ${{ inputs.input_path }}
        run: |
          mkdir -p "$WORK_DIR/github-actions"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from tournament_scheduler.pipeline.registration_sync import (
              RegistrationSyncError,
              sync_registered_teams_to_workbook,
          )

          input_path = Path(os.environ["INPUT_PATH"])
          if not input_path.exists():
              raise SystemExit(f"Input workbook not found: {input_path}")
          try:
              result = sync_registered_teams_to_workbook(
                  os.environ["REGISTRATIONS_PATH"], input_path
              )
          except RegistrationSyncError as exc:
              raise SystemExit(f"Kunne ikke synkronisere påmeldte lag: {exc}") from exc

          Path(os.environ["WORK_DIR"]).joinpath("github-actions", "registration-sync.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2, default=str) + "\n", encoding="utf-8"
          )
          PY

      - name: "Skriv input-fingeravtrykk etter påmeldingssynk"
        env:
          INPUT_PATH: ${{ inputs.input_path }}
        run: |
          mkdir -p "$WORK_DIR/github-actions"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["INPUT_PATH"])
          if not path.exists():
              raise SystemExit(f"Input workbook not found: {path}")
          registrations = Path(os.environ["REGISTRATIONS_PATH"])
          payload = {
              "path": str(path),
              "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              "size_bytes": path.stat().st_size,
              "registrations_sha256": hashlib.sha256(registrations.read_bytes()).hexdigest(),
          }
          Path(os.environ["WORK_DIR"]).joinpath("github-actions", "input-fingerprint.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          PY

      - name: "Kjør kanoniske raske sjekker"
        run: scripts/check quick

      - name: "Kjør kanonisk operatørvalidering (ingen publisering)"
        env:
          INPUT_PATH: ${{ inputs.input_path }}
          LOG_LEVEL: ${{ inputs.log_level }}
        run: |
          mkdir -p "$WORK_DIR/github-actions" "$EXPORT_DIR"
          set +e
          scripts/rvv-miniputt operator run \
            --input "$INPUT_PATH" \
            --work-dir "$WORK_DIR" \
            --export-dir "$EXPORT_DIR" \
            --no-timestamped-export \
            --log-level "$LOG_LEVEL" \
            --non-strict \
            --allow-missing-sources \
            --iterations 1 \
            2>&1 | tee "$WORK_DIR/github-actions/validation.log"
          status=${PIPESTATUS[0]}
          set -e
          scripts/rvv-miniputt status --work-dir "$WORK_DIR" --json > "$WORK_DIR/github-actions/status.json" || true
          exit "$status"

      - name: "Kjør uavhengig vertskapsaudit"
        if: success()
        run: |
          test -f "$EXPORT_DIR/season_plan_overview.csv"
          python scripts/season-plan-audit.py \
            --registrations "$REGISTRATIONS_PATH" \
            --overview "$EXPORT_DIR/season_plan_overview.csv" \
            --json-out "$EXPORT_DIR/season_plan_audit.json" \
            --csv-out "$EXPORT_DIR/season_plan_hosting_audit.csv" \
            --max-deviation 1 \
            --fail-on-impossible-host \
            | tee "$WORK_DIR/github-actions/season-plan-audit.log"

      - name: "Last opp valideringsrapport"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-validation-${{ github.run_id }}
          path: |
            ${{ env.WORK_DIR }}/github-actions/input-fingerprint.json
            ${{ env.WORK_DIR }}/github-actions/registration-sync.json
            ${{ env.WORK_DIR }}/github-actions/validation.log
            ${{ env.WORK_DIR }}/github-actions/season-plan-audit.log
            ${{ env.WORK_DIR }}/github-actions/status.json
            ${{ env.WORK_DIR }}/run_manifest.json
            ${{ env.WORK_DIR }}/logs/**
            ${{ env.EXPORT_DIR }}/**
          if-no-files-found: warn
