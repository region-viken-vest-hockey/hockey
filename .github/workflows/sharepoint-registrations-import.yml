name: "SharePoint: importer påmeldte lag (JSON)"
run-name: "Registrations sync — issue #${{ inputs.issue_number }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Nummeret på GitHub-issuen som skal importeres"
        required: true
        type: string

permissions:
  contents: write
  issues: write

# The router debounces Power Automate bursts; serialize the actual import too
# so an older manually-dispatched run cannot overwrite the newest snapshot.
concurrency:
  group: sharepoint-registrations-import
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CANONICAL_PATH: "inputs/registrations/registered-teams.csv"

jobs:
  import-registrations:
    name: "Importer påmeldte lag fra SharePoint"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      changed: ${{ steps.import.outputs.changed }}
      sha256: ${{ steps.import.outputs.sha256 }}
      team_count: ${{ steps.import.outputs.team_count }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: "Hent kode"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Hent og valider sync-issue"
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" \
            --jq '{title, body, state, author_association}' \
            > "$RUNNER_TEMP/issue.json"

          jq -e '
            .author_association as $association
            | .title == "sharepoint-sync: registrations"
              and .state == "open"
              and (["OWNER", "MEMBER", "COLLABORATOR"] | index($association) != null)
          ' "$RUNNER_TEMP/issue.json" >/dev/null || {
            echo "Issue is not an open trusted registration sync request" >&2
            exit 1
          }

          jq -r '.body' "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/issue-body.txt"
          echo "body_file=$RUNNER_TEMP/issue-body.txt" >> "$GITHUB_OUTPUT"

      - name: "Sett opp Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: "Installer runtime-avhengigheter"
        run: pip install -e .

      - name: "Importer, valider og skriv kanonisk CSV"
        id: import
        env:
          ISSUE_BODY_FILE: ${{ steps.issue.outputs.body_file }}
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import os
          import re
          from pathlib import Path

          from tournament_scheduler.pipeline.registered_teams import (
              RegisteredTeamsValidationError,
              build_registered_teams_payload,
          )

          body = Path(os.environ["ISSUE_BODY_FILE"]).read_text(encoding="utf-8")
          fields = {}
          for raw_line in body.splitlines():
              match = re.match(r"^([a-z_][a-z0-9_]*)=(.*)$", raw_line.strip())
              if match:
                  fields[match.group(1)] = match.group(2).strip()

          if fields.get("source") != "sharepoint":
              raise SystemExit("source må være 'sharepoint'")
          if fields.get("target_path", os.environ["CANONICAL_PATH"]) != os.environ["CANONICAL_PATH"]:
              raise SystemExit("target_path matcher ikke kanonisk repository-sti")

          try:
              payload = json.loads(fields["content_json"])
          except KeyError:
              raise SystemExit("Mangler content_json")
          except json.JSONDecodeError as exc:
              raise SystemExit(f"content_json er ikke gyldig JSON: {exc}") from exc

          def extract_rows(value):
              if isinstance(value, list):
                  return value
              if not isinstance(value, dict):
                  raise ValueError("content_json må være en liste eller et objekt med registreringsrader")
              for key in ("body", "rows", "value", "data", "items", "registrations"):
                  rows = value.get(key)
                  if isinstance(rows, list):
                      headers = value.get("headers") or value.get("columns")
                      if headers and rows and all(isinstance(row, list) for row in rows):
                          return [dict(zip(headers, row)) for row in rows]
                      return rows
              if all(key in value for key in ("club", "label", "age_group")):
                  return [value]
              raise ValueError("Fant ingen registreringsrader i content_json")

          aliases = {
              "club": {"club", "klubb", "club_name", "klubbnavn"},
              "label": {"label", "lag", "team", "team_name", "lagnavn"},
              "age_group": {"age_group", "agegroup", "aldersgruppe", "årsklasse", "arsklasse"},
          }

          def canonical_key(raw):
              key = str(raw).strip().casefold().replace(" ", "_").replace("-", "_")
              for target, names in aliases.items():
                  if key in names:
                      return target
              return None

          source_rows = extract_rows(payload)
          public_rows = []
          for index, raw_row in enumerate(source_rows, start=1):
              if not isinstance(raw_row, dict):
                  raise SystemExit(f"JSON-kontrakt feilet: rad {index} er ikke et objekt")
              projected = {"club": "", "label": "", "age_group": ""}
              for raw_key, raw_value in raw_row.items():
                  key = canonical_key(raw_key)
                  if key:
                      projected[key] = "" if raw_value is None else str(raw_value).strip()
              public_rows.append(projected)

          buffer = io.StringIO(newline="")
          writer = csv.DictWriter(buffer, fieldnames=["club", "label", "age_group"], lineterminator="\n")
          writer.writeheader()
          writer.writerows(public_rows)
          normalized_bytes = buffer.getvalue().encode("utf-8")

          temp_csv = Path(os.environ["RUNNER_TEMP"]) / "registered-teams.csv"
          temp_csv.write_bytes(normalized_bytes)
          try:
              public_payload, _ = build_registered_teams_payload(temp_csv)
          except RegisteredTeamsValidationError as exc:
              raise SystemExit(f"Påmeldingsdata feilet validering: {exc}") from exc

          canonical_path = Path(os.environ["CANONICAL_PATH"])
          changed = not canonical_path.exists() or canonical_path.read_bytes() != normalized_bytes
          if changed:
              canonical_path.parent.mkdir(parents=True, exist_ok=True)
              canonical_path.write_bytes(normalized_bytes)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"changed={'true' if changed else 'false'}", file=output)
              print(f"sha256={hashlib.sha256(normalized_bytes).hexdigest()}", file=output)
              print(f"team_count={public_payload.get('total_teams', 0)}", file=output)
          PY

      - name: "Commit og push endrede påmeldingsdata"
        if: steps.import.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CANONICAL_PATH"
          git commit -m "[bot] [skip ci] Importer påmeldte lag fra SharePoint"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-registered-teams:
    name: "Generer og publiser påmeldte lag"
    needs: import-registrations
    if: needs.import-registrations.result == 'success'
    uses: ./.github/workflows/registration-publish.yml
    with:
      csv_path: inputs/registrations/registered-teams.csv
      workbook_path: inputs/season/input.xlsx
      checkout_ref: ${{ needs.import-registrations.outputs.commit_sha || github.sha }}
    secrets: inherit

  finalize-sync-issue:
    name: "Rapporter resultat og avslutt sync-issue"
    needs: [import-registrations, publish-registered-teams]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      IMPORT_RESULT: ${{ needs.import-registrations.result }}
      PUBLISH_RESULT: ${{ needs.publish-registered-teams.result }}
      TEAM_COUNT: ${{ needs.import-registrations.outputs.team_count }}
      FILE_CHANGED: ${{ needs.import-registrations.outputs.changed }}
      FILE_SHA256: ${{ needs.import-registrations.outputs.sha256 }}
    steps:
      - name: "Kommenter og lukk ved suksess"
        if: env.IMPORT_RESULT == 'success' && env.PUBLISH_RESULT == 'success'
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "✅ Påmeldingsdata er validert og publisert. Lag: ${TEAM_COUNT:-0}. Endret: ${FILE_CHANGED:-false}. SHA-256: ${FILE_SHA256:-ukjent}."
          gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --reason completed

      - name: "Lukk tidligere sync-issues etter vellykket nyeste kjøring"
        if: env.IMPORT_RESULT == 'success' && env.PUBLISH_RESULT == 'success'
        run: |
          gh api --paginate --slurp \
            "repos/$GH_REPO/issues?state=open&per_page=100" \
            | jq -r --argjson current "$ISSUE_NUMBER" '
                add[]
                | select(.pull_request == null)
                | select(.title == "sharepoint-sync: registrations")
                | select(.author_association as $association
                    | ["OWNER", "MEMBER", "COLLABORATOR"] | index($association) != null)
                | select(.number < $current)
                | .number
              ' \
            | while read -r previous_issue; do
                [ -n "$previous_issue" ] || continue
                gh issue close "$previous_issue" --repo "$GH_REPO" --reason "not planned" || true
              done

      - name: "Kommenter ved feil"
        if: env.IMPORT_RESULT != 'success' || env.PUBLISH_RESULT != 'success'
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "❌ Synkronisering feilet. Import: $IMPORT_RESULT. Publisering: $PUBLISH_RESULT. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
