name: "Aktivitetskalender: auto-publiser"

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: "Sti til kanoniske aktivitetsdata (JSON)"
        required: true
        default: "inputs/activities/activities.json"
  workflow_call:
    inputs:
      activity_input:
        description: "Sti til aktivitetsdatafil (JSON, eller XLSX for eksplisitte eldre kall)"
        type: string
        required: true
      activity_input_format:
        description: "'json' eller 'xlsx'"
        type: string
        required: false
        default: "json"
      checkout_ref:
        description: "Commit/ref som inneholder aktivitetsdataene"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: routine-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  WORK_DIR: .pipeline/github-activity-publish

jobs:
  publish-activity-calendar:
    name: "Publiser aktivitetskalender"
    environment: pages-publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Hent kode"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: "Sett opp Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: "Installer runtime-avhengigheter"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: "Finn inndata"
        id: resolve_input
        run: |
          INPUT="${{ inputs.activity_input || inputs.input_path || 'inputs/activities/activities.json' }}"
          FORMAT="${{ inputs.activity_input_format || 'json' }}"

          case "$INPUT" in
            *.json) FORMAT="json" ;;
            *.xlsx) FORMAT="xlsx" ;;
            *)
              echo "FEIL: Aktivitetsdata må være JSON eller XLSX: $INPUT" >&2
              exit 1
              ;;
          esac

          echo "input=$INPUT" >> "$GITHUB_OUTPUT"
          echo "format=$FORMAT" >> "$GITHUB_OUTPUT"
          echo "Resolved input=$INPUT format=$FORMAT"

      - name: "Normaliser kanoniske aktivitetsdata"
        if: steps.resolve_input.outputs.format == 'json'
        id: normalize_input
        run: |
          python - <<'PY'
          import os
          from datetime import date

          from tournament_scheduler.pipeline.activity_normalize import normalize_activity_json

          changed = normalize_activity_json(
              os.environ["ACTIVITY_INPUT"],
              year=date.today().year,
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={'true' if changed else 'false'}\n")
          print("Aktivitetsdata normalisert til ISO-datoer." if changed else "Aktivitetsdata var allerede normalisert.")
          PY
        env:
          ACTIVITY_INPUT: ${{ steps.resolve_input.outputs.input }}

      - name: "Lagre normaliserte aktivitetsdata"
        if: steps.normalize_input.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$ACTIVITY_INPUT"
          git commit -m "[bot] [skip ci] Normaliser aktivitetsdatoer"
          git push origin HEAD:main
        env:
          ACTIVITY_INPUT: ${{ steps.resolve_input.outputs.input }}

      - name: "Valider inndata og skriv fingeravtrykk"
        run: |
          mkdir -p "$WORK_DIR/github-actions"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from tournament_scheduler.pipeline.activity_export import (
              ActivityJSONValidationError,
              validate_content_json,
          )

          path = Path(os.environ["ACTIVITY_INPUT"])
          if not path.exists():
              raise SystemExit(f"Aktivitetsdata ikke funnet: {path}")

          if path.suffix.lower() == ".json":
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  validate_content_json(payload)
              except (json.JSONDecodeError, ActivityJSONValidationError) as exc:
                  raise SystemExit(f"Ugyldig aktivitets-JSON: {exc}") from exc

          payload = {
              "path": str(path),
              "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              "size_bytes": path.stat().st_size,
          }
          Path(os.environ["WORK_DIR"]).joinpath("github-actions", "input-fingerprint.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          PY
        env:
          ACTIVITY_INPUT: ${{ steps.resolve_input.outputs.input }}

      - name: "Publiser aktivitetskalender"
        run: |
          set -o pipefail
          mkdir -p "$WORK_DIR/github-actions"
          scripts/rvv-miniputt activities \
            --input "$ACTIVITY_INPUT" \
            --work-dir "$WORK_DIR" \
            --publish \
            --confirm-public \
            --json \
            2>&1 | tee "$WORK_DIR/github-actions/publish-result.json"
          scripts/rvv-miniputt status --work-dir "$WORK_DIR" --json > "$WORK_DIR/github-actions/status.json" || true
        env:
          ACTIVITY_INPUT: ${{ steps.resolve_input.outputs.input }}

      - name: "Vis publisert aktivitetsside"
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          ACTIVITY_URL="https://${OWNER}.github.io/${REPO}/latest/activities/"

          echo "Publisert HTML-side for aktivitetskalender: $ACTIVITY_URL"
          {
            echo "## Publisert aktivitetskalender"
            echo
            echo "Den publiserte HTML-siden er tilgjengelig her:"
            echo
            echo "[$ACTIVITY_URL]($ACTIVITY_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Last opp publiseringsbevis"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-publish-${{ github.run_id }}
          path: |
            ${{ env.WORK_DIR }}/github-actions/input-fingerprint.json
            ${{ env.WORK_DIR }}/github-actions/publish-result.json
            ${{ env.WORK_DIR }}/github-actions/status.json
            ${{ env.WORK_DIR }}/run_manifest.json
            ${{ env.WORK_DIR }}/public_bundle/pages_privacy_report.json
          if-no-files-found: warn
