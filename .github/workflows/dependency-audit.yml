name: Dependency vulnerability audit

# Advisory lane (issue #914). Deliberately NOT a PR check and NOT part of
# `make check`: it needs the live PyPI advisory feed, so a feed outage must never
# block hermetic verification, season maintenance or publication. A red run means
# "findings (exit 1)" or "scan unknown (exit 2)"; it is never green on a failed scan.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: pip-audit (requirements.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"
      - name: Audit locked dependencies
        run: python scripts/dependency-audit.py
