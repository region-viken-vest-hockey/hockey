name: "SharePoint sync router"
run-name: >-
  SharePoint sync — ${{ github.event.issue.title == 'sharepoint-sync: registrations' && 'registrations' || github.event.issue.title == 'sharepoint-sync: activities' && 'activities' || 'ignored' }} — #${{ github.event.issue.number }}

on:
  issues:
    types: [opened, reopened]

permissions:
  actions: write
  issues: write

# Power Automate can open one issue for every AutoSave/file modification. Keep
# only the final issue in a burst and let that issue start the importer.
# GitHub allows one running and one pending run per group; a new event cancels
# the sleeping run and replaces any pending run.
concurrency:
  group: sharepoint-sync-router-${{ github.event.issue.title }}
  cancel-in-progress: true

env:
  DEBOUNCE_SECONDS: "30"

jobs:
  route:
    name: "Route SharePoint sync issue"
    if: >-
      ${{
        (github.event.issue.title == 'sharepoint-sync: registrations'
        || github.event.issue.title == 'sharepoint-sync: activities')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      }}
    runs-on: ubuntu-latest
    # The timeout includes runner startup and queue overhead, not just sleep.
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - name: "Vent til endringene har roet seg"
        run: sleep "$DEBOUNCE_SECONDS"

      - name: "Start matching sync workflow for newest issue"
        run: |
          case "$ISSUE_TITLE" in
            "sharepoint-sync: registrations")
              WORKFLOW="sharepoint-registrations-import.yml"
              ;;
            "sharepoint-sync: activities")
              WORKFLOW="sharepoint-import.yml"
              ;;
            *)
              echo "No supported SharePoint route for: $ISSUE_TITLE" >&2
              exit 1
              ;;
          esac

          # The router run is cancelled when another issue arrives during the
          # delay. Query again as a race-safe final check, because a new issue
          # can arrive just before dispatch.
          LATEST_ISSUE="$({
            gh api --paginate --slurp \
              "repos/$GH_REPO/issues?state=open&per_page=100" \
              | jq -r --arg title "$ISSUE_TITLE" '
                add
                | map(select(.pull_request == null)
                    | select(.title == $title)
                    | select(["OWNER", "MEMBER", "COLLABORATOR"] | index(.author_association) != null))
                | sort_by(.created_at, .number)
                | last.number // empty
              '
          })"

          if [ -z "$LATEST_ISSUE" ]; then
            echo "No open trusted sync issue found for $ISSUE_TITLE" >&2
            exit 1
          fi

          gh workflow run "$WORKFLOW" \
            --repo "$GH_REPO" \
            --ref main \
            -f issue_number="$LATEST_ISSUE"

          echo "Dispatched $WORKFLOW for newest issue #$LATEST_ISSUE (after debounce)"
