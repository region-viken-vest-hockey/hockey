name: "Påmeldte lag: auto-publiser"

on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: "Sti til kanonisk påmeldings-CSV"
        required: true
        default: "inputs/registrations/registered-teams.csv"
      workbook_path:
        description: "Sti til sesongarbeidsboken som skal oppdateres"
        required: true
        default: "inputs/season/input.xlsx"
  workflow_call:
    inputs:
      csv_path:
        description: "Sti til kanonisk påmeldings-CSV"
        type: string
        required: false
        default: "inputs/registrations/registered-teams.csv"
      workbook_path:
        description: "Sti til sesongarbeidsboken som skal oppdateres"
        type: string
        required: false
        default: "inputs/season/input.xlsx"
      checkout_ref:
        description: "Commit/ref som inneholder påmeldingsdataene"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: registration-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  WORK_DIR: .pipeline/github-registration-publish
  CSV_PATH: ${{ inputs.csv_path || 'inputs/registrations/registered-teams.csv' }}
  WORKBOOK_PATH: ${{ inputs.workbook_path || 'inputs/season/input.xlsx' }}

jobs:
  publish-registered-teams:
    name: "Publiser påmeldte lag"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Hent kode"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: "Sett opp Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: "Installer runtime-avhengigheter"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: "Valider at CSV er autoritativ SharePoint-snapshot"
        run: python scripts/check-registration-snapshot.py

      - name: "Valider påmeldingsdata og skriv fingeravtrykk"
        run: |
          mkdir -p "$WORK_DIR/github-actions"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from tournament_scheduler.pipeline.registered_teams import (
              RegisteredTeamsValidationError,
              build_registered_teams_payload,
          )

          path = Path(os.environ["CSV_PATH"])
          if not path.exists():
              raise SystemExit(f"Påmeldings-CSV ikke funnet: {path}")

          try:
              public_payload, validation_report = build_registered_teams_payload(path)
          except RegisteredTeamsValidationError as exc:
              raise SystemExit(f"Ugyldige påmeldingsdata: {exc}") from exc

          work_dir = Path(os.environ["WORK_DIR"]) / "github-actions"
          work_dir.joinpath("validation-report.json").write_text(
              json.dumps(validation_report, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          fingerprint = {
              "path": str(path),
              "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              "size_bytes": path.stat().st_size,
              "team_count": public_payload.get("total_teams", 0),
              "club_count": public_payload.get("total_clubs", 0),
          }
          work_dir.joinpath("input-fingerprint.json").write_text(
              json.dumps(fingerprint, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          PY

      - name: "Synkroniser registreringer til arbeidsbok"
        id: sync
        run: |
          mkdir -p "$WORK_DIR/github-actions"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from tournament_scheduler.pipeline.registration_sync import (
              RegistrationSyncError,
              sync_registered_teams_to_workbook,
          )

          csv_path = os.environ["CSV_PATH"]
          workbook_path = os.environ["WORKBOOK_PATH"]

          workbook = Path(workbook_path)
          fallback = Path("input.xlsx")
          if not workbook.exists() and fallback.exists():
              workbook = fallback
              workbook_path = str(fallback)

          work_dir = Path(os.environ["WORK_DIR"])
          sync_report_path = work_dir / "github-actions" / "sync-report.json"

          try:
              result = sync_registered_teams_to_workbook(csv_path, workbook_path)
          except RegistrationSyncError as exc:
              sync_report_path.write_text(
                  json.dumps({"error": str(exc)}, indent=2, ensure_ascii=False), encoding="utf-8"
              )
              print(f"SYNC_ERROR: {exc}", file=sys.stderr)
              sys.exit(1)

          result["workbook_path"] = workbook_path
          sync_report_path.write_text(
              json.dumps(result, indent=2, ensure_ascii=False, default=str), encoding="utf-8"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"changed={'true' if result['changed'] else 'false'}", file=output)
              print(f"workbook_path={workbook_path}", file=output)
              print(f"team_count={result['team_count']}", file=output)

          print(f"SYNC_OK changed={result['changed']} teams={result['team_count']}")
          PY

      - name: "Commit oppdatert arbeidsbok"
        if: steps.sync.outputs.changed == 'true'
        env:
          WORKBOOK_PATH: ${{ steps.sync.outputs.workbook_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$WORKBOOK_PATH"
          git commit -m "[bot] [skip ci] Oppdater Lag-arket fra godkjente påmeldinger" -m "Automatisk synkronisert fra $CSV_PATH."
          git push origin HEAD:main

      - name: "Publiser påmeldte lag"
        run: |
          mkdir -p "$WORK_DIR/github-actions"
          scripts/rvv-miniputt registered-teams \
            --csv "$CSV_PATH" \
            --work-dir "$WORK_DIR" \
            --publish \
            --confirm-public \
            --json \
            2>&1 | tee "$WORK_DIR/github-actions/publish-result.json"
          scripts/rvv-miniputt status --work-dir "$WORK_DIR" --json > "$WORK_DIR/github-actions/status.json" || true

      - name: "Vis publisert HTML-side"
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${OWNER}.github.io/${REPO}/latest/registered-teams/pameldte-lag.html"

          echo "Publisert side for påmeldte lag: $PAGES_URL"
          {
            echo "## Publisert side for påmeldte lag"
            echo
            echo "[$PAGES_URL]($PAGES_URL)"
            echo
            echo "Denne HTML-siden kan brukes direkte som kilde i en iframe."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Last opp publiseringsbevis"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registration-publish-${{ github.run_id }}
          path: |
            ${{ env.WORK_DIR }}/github-actions/input-fingerprint.json
            ${{ env.WORK_DIR }}/github-actions/validation-report.json
            ${{ env.WORK_DIR }}/github-actions/sync-report.json
            ${{ env.WORK_DIR }}/github-actions/publish-result.json
            ${{ env.WORK_DIR }}/github-actions/status.json
            ${{ env.WORK_DIR }}/run_manifest.json
            ${{ env.WORK_DIR }}/public_bundle/pages_privacy_report.json
          if-no-files-found: warn
