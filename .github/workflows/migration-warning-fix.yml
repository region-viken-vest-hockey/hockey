name: Migration warning fix

on:
  pull_request:
    paths:
      - ".github/workflows/migration-warning-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'chatgpt/remove-desktop-update-rvv-skill'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Patch proportional hosting warnings for partial calendar coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tournament_scheduler/warnings.py")
          text = path.read_text()
          old = '    for row in breakdown.get("age_group_breakdown", []):\n'
          new = (
              '    # When calendar coverage is partial, proportional host assignments for the missing\n'
              '    # clubs are intentionally manual. Keep the fairness diagnostics/note, but do not\n'
              '    # emit legacy deviation warnings for a distribution that still requires manual ice.\n'
              '    proportional_rows = (\n'
              '        [] if breakdown.get("missing_calendar_clubs") else breakdown.get("age_group_breakdown", [])\n'
              '    )\n'
              '    for row in proportional_rows:\n'
          )
          if old not in text:
              raise SystemExit("expected scan_hosting_warnings loop not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tournament_scheduler/warnings.py
          git commit -m "suppress hosting deviation warnings with partial calendar coverage"
          git push origin HEAD:${{ github.head_ref }}
