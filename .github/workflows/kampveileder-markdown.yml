name: "Docs: Kampveileder Markdown"

on:
  push:
    branches:
      - main
    paths:
      - "docs/kampveileder-for-3-mot-3-spill-revidert-august-25.pdf"
      - "scripts/convert-kampveileder.sh"
      - ".github/workflows/kampveileder-markdown.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kampveileder-markdown-main
  cancel-in-progress: false

jobs:
  convert:
    name: "Convert NIHF Kampveileder PDF"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout main"
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install pinned MarkItDown PDF support"
        run: python -m pip install 'markitdown[pdf]==0.1.7'

      - name: "Generate Markdown"
        run: sh scripts/convert-kampveileder.sh

      - name: "Commit generated Markdown when changed"
        env:
          OUTPUT: docs/kampveileder-for-3-mot-3-spill-revidert-august-25.md
        run: |
          if git diff --quiet -- "$OUTPUT" && git ls-files --error-unmatch "$OUTPUT" >/dev/null 2>&1; then
            echo "Kampveileder Markdown is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT"
          git commit -m "docs: regenerate Kampveileder Markdown"
          git push origin HEAD:main
