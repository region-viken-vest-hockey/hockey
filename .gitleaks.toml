title = "RVV Miniputt secret scan"

[extend]
useDefault = true

[allowlist]
description = "Repo-specific placeholders and generated data"
paths = [
  '''^\.pipeline/''',
  '''^\.pi/logs/''',
  '''^export/''',
  '''^htmlcov/''',
  '''^node_modules/''',
  '''^venv/''',
  '''^\.pytest_cache/''',
  '''^__pycache__/''',
  '''^rvv_miniputt\.egg-info/''',
]
regexes = [
  '''SuperSecret123''',
  '''s3cr3t!pass''',
  '''sk_test_placeholder''',
  # Reviewed false positive: season batch `reviewed_token` values recorded in
  # decision history are SHA-256 scenario fingerprints, not credentials.
  '''^(rs|rc)-[0-9a-f]{64}$''',
]
